name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Modern Unit and Regression Test Suites
      run: |
        python -m unittest scratch/test_achievements_service.py scratch/test_cloud_sync.py scratch/test_power_service.py scratch/test_save_backup.py scratch/test_stats_service.py scratch/test_in_game_overlay.py scratch/test_platform_layer.py scratch/test_massive_library_optimization.py scratch/test_collections_and_filters.py scratch/test_unit_mocked_core.py
        python scratch/mega_audit_test_suite.py
